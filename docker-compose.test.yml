services:
  missing-ebooks:
    image: missing-ebooks:test
    container_name: missing-ebooks-test
    ports:
      - "127.0.0.1:13379:13379"
    environment:
      MISSING_EBOOKS_LIBRARY_ROOTS: /audiobooks
      MISSING_EBOOKS_LOG: debug
    volumes:
      - /mnt/jane-nas/Entertainment/Audiobooks:/audiobooks
    restart: "no"
