# Dependabot configuration.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Rust crate dependencies. Group minor + patch updates into a single weekly
  # PR so the maintainer triages one diff instead of one per crate.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Dockerfile base image pins (tag@sha256:<digest> form). Alpine digest bumps
  # flow through so security updates land unattended. The rust image is
  # ignored: bumping it needs coordinated edits to rust-toolchain.toml and
  # Cargo.toml rust-version (enforced by the toolchain-drift CI gate), which
  # Dependabot cannot do on its own. Bump Rust by hand when raising MSRV is
  # intentional.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "rust"

  # GitHub Actions `uses:` pins across .github/workflows/. Group minor + patch
  # bumps into one PR; let majors come through individually so release notes
  # get read.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
