name: cargo-deny

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 09:00 UTC, so fresh advisories surface without a code change.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
