# cargo-deny policy.
#
# The license allow-list below lists every license present in the dependency
# tree. If a new dependency introduces a license that is not here, the licenses
# check fails; regenerate the set with `cargo-deny list` and add the new license
# only after confirming it is compatible with this crate's AGPL-3.0-or-later terms.

[advisories]
# RUSTSEC advisories and unmaintained crates fail by default in cargo-deny 0.19.
# Add an advisory ID here only with a written reason and, ideally, a tracking link.
ignore = []

[licenses]
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
# Current, accepted duplicates. Each entry is a known transitive conflict.
# Remove it when the tree converges. Re-run `cargo deny check bans` after a dep bump.
skip = [
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.4.2" },
  { name = "wit-bindgen", version = "=0.51.0" },
  { name = "wit-bindgen", version = "=0.57.1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
