[package]
name = "missing-ebooks"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Surface audiobook folders that hold audio but no matching ebook"
license = "GPL-3.0-only"
repository = "https://github.com/noahbaculi/missing-ebooks"

# Examples default to test = false, which hides the explore harness's tests
# behind `cargo test --example explore`. Opt it into the default run so plain
# `cargo test` covers every target.
[[example]]
name = "explore"
path = "examples/explore.rs"
test = true

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
globset = "0.4.18"
lexical-sort = "0.3.1"
maud = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"

[dev-dependencies]
http-body-util = "0.1.3"
proptest = "1.11.0"
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["signal"] }
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"

[lints.rust]
missing_docs = "warn"
