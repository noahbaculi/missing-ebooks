[package]
name = "missing-ebooks"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Surface audiobook folders that hold audio but no matching ebook"
license = "AGPL-3.0-or-later"
repository = "https://github.com/noahbaculi/missing-ebooks"
publish = false

# Explicit target blocks document each binary and bench's path even though
# cargo auto-discovers src/bin/*.rs and benches/*.rs; the benches need
# `harness = false` so they run as plain executables (criterion or custom).
[[bin]]
name = "explore"
path = "src/bin/explore.rs"

[[bin]]
name = "missing-ebooks"
path = "src/main.rs"

# Renamed from the auto-discovered `demo` so `cargo install missing-ebooks`
# does not plant a generic-named binary on user PATHs.
[[bin]]
name = "missing-ebooks-demo"
path = "src/bin/demo.rs"

[[bench]]
name = "render"
path = "benches/render.rs"
harness = false

[[bench]]
name = "scan_bench"
path = "benches/scan_bench.rs"
harness = false

[[bench]]
name = "tree_bench"
path = "benches/tree_bench.rs"
harness = false

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.7"
axum = "0.8.9"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.3"
globset = "0.4.18"
lexical-sort = "0.3.1"
maud = "0.27.0"
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[dev-dependencies]
criterion = "0.8"
filetime = "0.2"
http-body-util = "0.1.3"
libc = "0.2"
proptest = "1.11.0"
sha2 = "0.11"
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Pedantic allow-list. Each entry carries a one-line reason; revisit case-by-case.
must_use_candidate = "allow"         # Project-wide: factories and pure getters are obvious from their name; #[must_use] noise outweighs the benefit.
doc_markdown = "allow"               # Plenty of legitimate prose tokens (ETag, MarkOverlay, DemoState) read fine without backticks.
cast_precision_loss = "allow"        # All hits are usize↔f64 in audited percent/ratio math; not worth per-site allows.
cast_sign_loss = "allow"             # All hits are .floor()/.round() back to usize after a guarded non-negative compute.
cast_possible_truncation = "allow"   # Same audited percent/ratio sites as the cast_precision_loss/sign_loss pair.
too_many_lines = "allow"             # Scenario builders and list_dir_all are deliberately flat; splitting them hides intent.
duration_suboptimal_units = "allow"  # from_mins/from_hours stabilized in 1.96 but the from_secs(N) literals read fine in tests.
unchecked_time_subtraction = "allow" # Hits are test code using Instant::now() - Duration with controlled inputs; no underflow risk.
items_after_statements = "allow"     # Nested helper fns inside long render tests stay near their callsite for readability.
similar_names = "allow"              # `marker` vs `marked` is intentional vocabulary, not a typo trap.
if_not_else = "allow"                # Hot-path-first branch order is deliberate; flipping it hides the common case.
single_match_else = "allow"          # Match-with-block-arms is clearer than if-let when the None arm is multi-statement.
map_unwrap_or = "allow"              # `.map(f).unwrap_or(x)` reads more linearly than `.map_or(x, f)` when f is long.

[lints.rust]
missing_docs = "deny"

# panic = "unwind" (the default, kept deliberately): tokio catches a per-task
# panic and the server survives, so a single bad request never aborts the
# process. Do not switch to abort.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
