[package]
name = "missing-ebooks"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Surface audiobook folders that hold audio but no matching ebook"
license = "GPL-3.0-only"
repository = "https://github.com/noahbaculi/missing-ebooks"

[dependencies]
anyhow = "1.0.102"
globset = "0.4.18"
lexical-sort = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"

[dev-dependencies]
serde_json = "1.0.150"
tempfile = "3.27.0"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"

[lints.rust]
missing_docs = "warn"
