[package]
name = "missing-ebooks"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Surface audiobook folders that hold audio but no matching ebook"
license = "AGPL-3.0-or-later"
repository = "https://github.com/noahbaculi/missing-ebooks"
publish = false

# Explicit target blocks document each binary and bench's path even though
# cargo auto-discovers src/bin/*.rs and benches/*.rs; the benches need
# `harness = false` so they run as plain executables (criterion or custom).
[[bin]]
name = "explore"
path = "src/bin/explore.rs"

[[bin]]
name = "missing-ebooks"
path = "src/main.rs"

# Renamed from the auto-discovered `demo` so `cargo install missing-ebooks`
# does not plant a generic-named binary on user PATHs.
[[bin]]
name = "missing-ebooks-demo"
path = "src/bin/demo.rs"

[[bench]]
name = "render"
path = "benches/render.rs"
harness = false

[[bench]]
name = "scan_bench"
path = "benches/scan_bench.rs"
harness = false

[[bench]]
name = "tree_bench"
path = "benches/tree_bench.rs"
harness = false

[[test]]
name = "sse"
path = "tests/sse.rs"

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.7"
axum = "0.8.9"
clap = { version = "4", features = ["derive", "env"] }
enum-map = "2.7"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.2"
globset = "0.4.18"
lexical-sort = "0.3.1"
maud = "0.27.0"
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-stream = "0.1"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[dev-dependencies]
criterion = "0.7"
filetime = "0.2"
http-body-util = "0.1.3"
libc = "0.2"
proptest = "1.11.0"
sha2 = "0.10"
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints.clippy]
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"

[lints.rust]
missing_docs = "warn"

# panic = "unwind" (the default, kept deliberately): tokio catches a per-task
# panic and the server survives, so a single bad request never aborts the
# process. Do not switch to abort.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
