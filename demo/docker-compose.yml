# The demo stack: the session-router and a Cloudflare Tunnel client. No host
# ports are published. cloudflared reaches the router over the compose network,
# and Cloudflare routes demo-missing-ebooks.noahbaculi.com to it through the
# tunnel. See demo/README.md for the one-time tunnel setup.
services:
  router:
    build:
      # Build context is the repo root so the image can compile both the core
      # explore example and the router crate.
      context: ..
      dockerfile: demo/Dockerfile
    expose:
      - "8080"
    environment:
      ROUTER_BIND: 0.0.0.0:8080
      ROUTER_SCENARIO: mixed-forest
      ROUTER_MAX_SANDBOXES: "50"
      ROUTER_MAX_PER_IP: "2"
      ROUTER_IDLE_SECS: "1200"
      ROUTER_PORT_RANGE: "9000-9100"
    # /healthz answers without spawning a sandbox, so an unattended host restarts
    # a wedged router instead of leaving it serving errors.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped
