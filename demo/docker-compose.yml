# The demo stack: the in-memory demo server and a Cloudflare Tunnel client. No
# host ports are published. cloudflared reaches the demo over the compose
# network, and Cloudflare routes demo-missing-ebooks.noahbaculi.com to it through
# the tunnel. See demo/README.md for the one-time tunnel setup.
services:
  demo:
    build:
      # Build context is the repo root so the image can compile the crate.
      context: ..
      dockerfile: demo/Dockerfile
    expose:
      - "8080"
    environment:
      DEMO_BIND: 0.0.0.0:8080
      DEMO_SCENARIO: mixed-forest
      DEMO_MAX_SESSIONS: "1000"
      DEMO_IDLE_SECS: "1200"
      # Name of the cookie that pins a visitor to their in-memory session.
      DEMO_COOKIE_NAME: me_demo_sid
    # /healthz answers without touching the session table, so an unattended host
    # restarts a wedged server instead of leaving it serving errors.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      demo:
        condition: service_healthy
    restart: unless-stopped
