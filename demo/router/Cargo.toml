[package]
name = "missing-ebooks-demo-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Session router that fronts the missing-ebooks explore harness for a public demo"
license = "AGPL-3.0-or-later"
publish = false

# An empty workspace table makes this crate its own workspace root, so cargo
# does not try to fold it into the parent missing-ebooks package that lives two
# directories up.
[workspace]

[[bin]]
name = "router"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
getrandom = "0.2"
nix = { version = "0.29", features = ["signal"] }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
