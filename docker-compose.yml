# Minimal compose sample. Boots missing-ebooks against one library root.
# For a run-as user, multiple roots, log verbosity, or a mounted config.toml,
# see docker-compose.advanced.yml and the README's "Advanced configuration".
services:
  missing-ebooks:
    image: ghcr.io/noahbaculi/missing-ebooks:latest
    container_name: missing-ebooks
    ports:
      - "127.0.0.1:13379:13379"
    environment:
      MISSING_EBOOKS_LIBRARY_ROOTS: /audiobooks
    volumes:
      - /path/to/audiobooks:/audiobooks
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
