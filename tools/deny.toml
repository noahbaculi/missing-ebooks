# cargo-deny policy.
#
# The license allow-list below lists every license present in the dependency
# tree. If a new dependency introduces a license that is not here, the licenses
# check fails; regenerate the set with `cargo-deny list` and add the new license
# only after confirming it is compatible with this crate's AGPL-3.0-or-later terms.

[advisories]
# Fail on RUSTSEC advisories, yanked crates still in the lockfile, and any
# unmaintained transitive. Add an advisory ID to `ignore` only with a written
# reason and, ideally, a tracking link.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
# Current, accepted duplicates. Each entry is a known transitive conflict.
# Remove it when the tree converges. Re-run `cargo deny check --config tools/deny.toml bans` after a dep bump.
skip = [
  # syn 3.x is the new common version; some transitives still pull syn 2.x.
  { name = "syn", version = "=2.0.119" },
  { name = "syn", version = "=3.0.6" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
