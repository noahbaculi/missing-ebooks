# Project-local tool pins. The Rust compiler and its components (clippy,
# rustfmt) are owned by rust-toolchain.toml, which rustup, CI, and
# rust-analyzer all read directly. This file pins the cargo-based dev tools
# layered on top, so the bacon-driven UI loop (bacon.toml) runs the same
# version for anyone who clones the repo instead of leaning on a global install.

[tools]
"cargo:bacon" = "~3.0"
"aqua:EmbarkStudios/cargo-deny" = "0.19"
node = "22"
"npm:typescript" = "5"
"cargo:cargo-nextest" = "0.9"
"cargo:cargo-machete" = "0.9"
typos = "1"
taplo = "0.10"
ast-grep = "0.44"

[tasks.setup]
description = "Point this clone's git at the committed hooks in .githooks"
run = "git config core.hooksPath .githooks"

[tasks.lint]
description = "Run fmt, clippy, typos, taplo, and the unused-dep check"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets",
  "typos",
  "taplo format --check",
  "cargo machete",
]

[tasks.typecheck]
description = "Type-check the client JS with tsc (check only, no emit)"
run = "tsc --noEmit"

[tasks."test:hooks"]
description = "Run the pre-commit hook test"
run = "sh tests/hooks/pre-commit.sh"

[tasks."test:docker-entrypoint"]
description = "Run the container entrypoint shell test"
run = "sh tests/docker/entrypoint.sh"

[tasks."test:accent"]
description = "Check the accent ink derivation clears AA and its two copies agree"
run = "node tests/accent/derive.test.mjs"

[hooks]
# Point this clone's git at .githooks the first time mise's shell integration
# fires the enter hook here, so the committed pre-commit script runs without
# anyone remembering `mise run setup`. The guard short-circuits when the value
# is already correct, so re-entering the directory does not churn .git/config.
# Each worktree has its own .git/config, so this fires per worktree.
enter = "[ \"$(git config core.hooksPath)\" = .githooks ] || git config core.hooksPath .githooks"

[tasks.test]
description = "Run the test suite with nextest plus doctests"
run = [
  "cargo nextest run --locked",
  "cargo test --doc --locked",
]

[tasks.check]
description = "Run the full pre-commit-equivalent check set"
run = [
  "mise run lint",
  "RUSTDOCFLAGS=\"-D warnings\" cargo doc --no-deps --quiet",
  "mise run typecheck",
  "mise run test:accent",
  "mise run test",
]
